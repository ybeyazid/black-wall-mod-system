# bwms-scoreboard — fonte única de leitura/escrita do placar real (PENDENCIAS-UNIFICADAS.md).
# Zero-dep, offline, arm64. Mesma filosofia "fonte única" de bwms-hashes: evita 2 implementações
# do parser da tabela divergirem entre bwms-ai-agent/promote.rs e qualquer outra ferramenta.
[package]
name = "bwms-scoreboard"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Parser/writer da tabela PLACAR REAL de cp77-symbols/notes/PENDENCIAS-UNIFICADAS.md."
authors = ["blackwall"]
license = "MIT OR Apache-2.0"

[lib]
name = "bwms_scoreboard"
path = "src/lib.rs"

[dependencies]

# Tabela [workspace] vazia: mantém o crate isolado de qualquer workspace pai
# (mods-research contém vários repos clonados; não queremos ser absorvidos).
[workspace]

[profile.release]
opt-level = 3
