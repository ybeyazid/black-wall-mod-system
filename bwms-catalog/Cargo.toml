# bwms-catalog — candidatos de RE prontos pra investigar (ranking do catálogo exaustivo) +
# checagem de native-no-dylib + bookkeeping de touched-today.tsv, tudo IN-PROCESS (zero
# subprocess/Python/bash pra lógica — regra-mãe do projeto). Mesma filosofia "fonte única"
# de bwms-scoreboard/bwms-hashes.
[package]
name = "bwms-catalog"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Candidatos de RE + native-no-dylib + bookkeeping de touched-today.tsv, zero-dep."
license = "MIT OR Apache-2.0"

[lib]
name = "bwms_catalog"
path = "src/lib.rs"

[[bin]]
name = "native-check"
path = "src/bin/native_check.rs"

[dependencies]

# Crate isolado (mods-research tem vários repos clonados; cada binário é seu próprio workspace).
[workspace]
